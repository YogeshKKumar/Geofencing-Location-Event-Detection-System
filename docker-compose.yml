services:
  mysql:
    image: mysql:8.0
    container_name: geofencing-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geofencing_db
      MYSQL_USER: geofence_user
      MYSQL_PASSWORD: geofence_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geofencing-backend
    restart: unless-stopped
    environment:
      - MYSQL_SERVER=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=geofence_user
      - MYSQL_PASSWORD=geofence_password
      - MYSQL_DB=geofencing_db
      - DATABASE_URL=mysql+pymysql://geofence_user:geofence_password@mysql:3306/geofencing_db
      - JWT_SECRET=supersecretjwtkeyforproductiongeofencingplatform2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GEOFENCE_ACCURACY_THRESHOLD_METERS=100.0
      - GEOFENCE_HYSTERESIS_METERS=10.0
      - GEOFENCE_DEDUPLICATION_WINDOW_SECONDS=5.0
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geofencing-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
